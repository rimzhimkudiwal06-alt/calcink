<!doctype html>
<html>

<head>
    <meta charset="utf-8" />
    <title>CalcInk debug</title>
    <style>
        body {
            font-family: system-ui, sans-serif;
            margin: 24px;
            background: #fafafa;
        }

        .row {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            align-items: flex-start;
        }

        #pad {
            background: #fff;
            border: 2px solid #333;
            touch-action: none;
            cursor: crosshair;
        }

        #preview {
            image-rendering: pixelated;
            width: 224px;
            height: 224px;
            border: 2px solid #333;
            background: #000;
        }

        button {
            font-size: 16px;
            padding: 8px 14px;
            margin: 4px 4px 4px 0;
        }

        pre {
            background: #fff;
            border: 1px solid #ccc;
            padding: 10px;
            min-width: 300px;
        }
    </style>
</head>

<body>
    <h2>CalcInk debug</h2>
    <p>Draw one symbol or a whole expression. Recognition runs 400 ms after you lift the pen.</p>
    <div class="row">
        <div>
            <canvas id="pad" width="600" height="300"></canvas><br />
            <button id="clear">Clear</button>
            <button id="undo">Undo</button>
        </div>
        <div>
            <div>Model input (28x28, last symbol)</div>
            <canvas id="preview" width="28" height="28"></canvas>
        </div>
        <pre id="out">Draw something...</pre>
    </div>
    <script type="module" src="/src/debug.ts"></script>
</body>

</html>
